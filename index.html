<body>
  <main class="stage" id="stage" aria-label="朝の栄養キャッチゲーム">
    <div class="leaf l1"></div><div class="leaf l2"></div>
    <section class="intro" id="intro">

      <img class="titleLogo" src="assets/title-logo.webp" alt="朝の栄養キャッチ">
      <img class="introCup" src="assets/aojiru-cup.webp" alt="青汁のカップ">
      <div class="introRule"><span>ヨーグルト・野菜をキャッチ</span><span class="avoid">お菓子は避けよう！</span></div>
      <div class="autoStart" aria-live="polite">まもなくスタート！<small>グラスを左右にスライド</small></div>
    </section>
    <header><div class="brand"><small>いきいき乳酸菌とおいしい青汁W</small>朝の栄養キャッチ</div><div class="timer"><span id="time">15</span>秒</div></header>
    <div class="meter"><div class="meterFill" id="meter"></div><div class="meterText">栄養チャージ <span id="score">0</span>%</div></div>
    <div class="game" id="game">
      <div class="instruction" id="instruction"><span class="hand">☝️</span> グラスを左右に動かそう！<small>からだにうれしい食材をキャッチ</small><div class="guideRow"><span class="goodGuide">ヨーグルト・野菜 ○</span><span class="badGuide"><b>×</b> お菓子は避ける</span></div></div>
      <div class="combo" id="combo"><small>NICE COMBO!</small><span id="comboNum">0</span>連続</div>
      <div class="bonus" id="bonus">乳酸菌たっぷり！<strong>201億個</strong>ボーナス</div>
      <div class="basket" id="basket"><div class="basketArt"><img src="assets/aojiru-cup.webp" alt="青汁のグラス"></div><div class="basketTag">ここでキャッチ！</div></div>
    </div>
    <section class="end" id="end" aria-hidden="true">
      <div class="done">朝の栄養チャージ完成！</div>
      <h1>乳酸菌も<span class="punct">、</span>野菜の栄養も<span class="punct">。</span><br><em>おいしい1杯</em>で新習慣</h1>
      <div class="sub">内側から、美容と健康をサポート。</div>
      <img class="product" src="assets/cta-fv.webp" alt="いきいき乳酸菌とおいしい青汁W。乳酸菌201億個配合、シリーズ累計1,000万杯突破、おいしかった96%">
      <div class="offer"><div class="offerLead">毎日続けやすい、抹茶味の青汁</div><a class="cta" href="https://www.e-hapi.com/shop/lp/109624_03.aspx" target="_blank" rel="noopener">お得に試してみる！<small>公式サイトで詳しく見る　›</small></a></div>
      <button class="replay" id="replay" type="button">もう一度遊ぶ</button>
    </section>
  </main>
  <script>
  (()=>{
    const stage=document.getElementById('stage'),game=document.getElementById('game'),basket=document.getElementById('basket'),meter=document.getElementById('meter'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),comboNum=document.getElementById('comboNum'),bonusEl=document.getElementById('bonus'),end=document.getElementById('end'),replay=document.getElementById('replay'),intro=document.getElementById('intro');
    let running=false,items=[],score=0,combo=0,time=15,spawnCount=0,startAt=0,raf,timer,spawnTimer;
    const types=[{c:'lacto collectible',art:'col-yogurt',img:'item-yogurt.webp',t:'ヨーグルト',p:9},{c:'green collectible',art:'col-broccoli',img:'item-broccoli.webp',t:'ブロッコリー',p:7},{c:'green collectible',art:'col-carrot',img:'item-carrot.webp',t:'にんじん',p:7},{c:'green collectible',art:'col-greens',img:'item-barley.webp',t:'大麦若葉',p:7},{c:'vit collectible',art:'col-vitamin',img:'item-vitamin.webp',t:'ビタミン',p:7},{c:'green collectible',art:'col-fiber',img:'item-fiber.webp',t:'食物繊維',p:7},{c:'bad hazard',art:'haz-donut',img:'item-donut.webp',t:'NG！ドーナツ',p:-8},{c:'bad hazard',art:'haz-fries',img:'item-fries.webp',t:'NG！ポテト',p:-8},{c:'bad hazard',art:'haz-cake',img:'item-cake.webp',t:'NG！ケーキ',p:-8},{c:'bad hazard',art:'haz-chips',img:'item-chips.webp',t:'NG！スナック',p:-8}];
    function move(clientX){if(!running)return;const r=game.getBoundingClientRect(),w=basket.offsetWidth;let x=Math.max(w/2,Math.min(r.width-w/2,clientX-r.left));basket.style.left=x+'px'}
    game.addEventListener('pointermove',e=>move(e.clientX));game.addEventListener('pointerdown',e=>{move(e.clientX);game.setPointerCapture?.(e.pointerId)});
    function spawn(forceGood=false){if(!running)return;const r=game.getBoundingClientRect(),guided=spawnCount<2,goodCount=6,data=(forceGood||guided)?types[spawnCount%goodCount]:types[Math.floor(Math.random()*types.length)];const el=document.createElement('div');el.className='item '+data.c+' '+data.art;el.innerHTML='<span class="spriteCrop"><img src="assets/'+data.img+'" alt=""></span><span class="itemLabel">'+data.t+'</span>';const size=Math.max(76,Math.min(100,r.width*.22));el.style.width=el.style.height=size+'px';const x=guided?(r.width-size)/2:10+Math.random()*(r.width-size-20),speed=r.height*(.27+Math.random()*.07),startY=-size-18;game.insertBefore(el,basket);const item={el,x,y:startY,startY,born:performance.now(),size,speed,p:data.p};el.style.transform=`translate3d(${x}px,${startY}px,0)`;items.push(item);spawnCount++;}
    function floating(x,y,text,bad=false){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';if(bad)f.style.color='#db3c31';game.appendChild(f);setTimeout(()=>f.remove(),850)}
    function hit(it){it.el.remove();if(it.p>0){score=Math.min(100,score+it.p);combo++;basket.classList.add('catch');setTimeout(()=>basket.classList.remove('catch'),170);floating(it.x+it.size/2,it.y,'GOOD!  +'+it.p+'%');if(combo>=2){comboNum.textContent=combo;comboEl.classList.add('show');setTimeout(()=>comboEl.classList.remove('show'),420)}}else{score=Math.max(0,score+it.p);combo=0;floating(it.x+it.size/2,it.y,'NG！お菓子は避けよう',true);stage.classList.remove('shake');void stage.offsetWidth;stage.classList.add('shake')}meter.style.width=score+'%';scoreEl.textContent=score;}
    function frame(ts){if(!running)return;const br=basket.getBoundingClientRect(),gr=game.getBoundingClientRect();items=items.filter(it=>{it.y=it.startY+it.speed*((ts-it.born)/1000);it.el.style.transform=`translate3d(${it.x}px,${it.y}px,0)`;const ir={left:gr.left+it.x,right:gr.left+it.x+it.size,top:gr.top+it.y,bottom:gr.top+it.y+it.size};const catchLine=br.top+18;if(ir.bottom>=catchLine&&ir.top<=br.bottom-5&&ir.right>=br.left+8&&ir.left<=br.right-8){hit(it);return false}if(it.y>gr.height+12){it.el.remove();if(it.p>0)combo=0;return false}return true});raf=requestAnimationFrame(frame)}
    function start(){cancelAnimationFrame(raf);clearInterval(timer);clearInterval(spawnTimer);items.forEach(i=>i.el.remove());items=[];score=0;combo=0;time=15;spawnCount=0;meter.style.width='0';scoreEl.textContent='0';timeEl.textContent='15';end.classList.remove('show');end.setAttribute('aria-hidden','true');basket.style.left='50%';running=true;startAt=performance.now();spawn();spawnTimer=setInterval(()=>spawn(time<=4),550);raf=requestAnimationFrame(frame);timer=setInterval(()=>{const next=Math.max(0,Math.ceil(15-(performance.now()-startAt)/1000));if(next!==time){time=next;timeEl.textContent=time;if(time===4){bonusEl.classList.remove('on');void bonusEl.offsetWidth;bonusEl.classList.add('on')}}if(time<=0)finish()},250)}
    function finish(){if(!running)return;running=false;clearInterval(timer);clearInterval(spawnTimer);cancelAnimationFrame(raf);items.forEach(i=>i.el.remove());items=[];score=100;meter.style.width='100%';scoreEl.textContent='100';setTimeout(()=>{end.classList.add('show');end.setAttribute('aria-hidden','false')},450)}
    setTimeout(()=>{intro.classList.add('hide');setTimeout(start,280)},2800);replay.addEventListener('click',start);window.addEventListener('resize',()=>{basket.style.left='50%'});
  })();
  </script>
</body>
</html>
